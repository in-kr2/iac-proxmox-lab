---
- name: Verkkopalvelimen konfigurointi
  hosts: app_servers
  become: yes
  tasks:
    - name: Odota toimivaa yhteyttä
      ansible.builtin.wait_for_connection:
        timeout: 300

    - name: Odota, että Cloud-Init on valmis
      ansible.builtin.command: cloud-init status --wait
      register: cloudinit_status
      changed_when: false
      failed_when: cloudinit_status.rc == 1

    - name: Asennetaan Docker ja riippuvuudet
      ansible.builtin.apt:
        name:
          - docker.io
          - python3-docker
        state: present
        update_cache: yes

    - name: Varmistetaan, että Docker on käynnissä
      ansible.builtin.systemd:
        name: docker
        state: started
        enabled: yes

    - name: Kopioidaan sovellus ja sen tiedot
      ansible.builtin.copy:
        src: "../app/nginx/"
        dest: "/opt/web-app/"
      register: app_files

    - name: Rakennetaan Docker-image
      community.docker.docker_image:
        name: web-app
        build:
          path: /opt/web-app
        source: build
        force_source: "{{ app_files.changed }}"

    - name: Käynnistetään Nginx-kontti
      community.docker.docker_container:
        name: web-service
        image: web-app
        state: started
        restart_policy: unless-stopped
        published_ports:
          - "80:80"
